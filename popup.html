<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MuraNight</title>
    <link rel="icon" type="image/svg+xml" href="src/logo.svg" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="ui-shell bg-[#f8fafc] p-0 font-sans antialiased text-slate-900">
    <main class="ui-root relative w-[360px] overflow-hidden rounded-[20px] bg-gradient-to-b from-[#f8fafc] to-white p-3">
      <header class="mb-3 flex items-center justify-between px-1">
        <div
          id="logoSlot"
          class="ui-logo-slot flex h-10 items-center gap-2 rounded-lg bg-white/70 px-2"
          data-i18n-aria-label="logo_aria"
          aria-label="App logo and name"
        >
          <img src="src/logo.svg" alt="Logo MuraNight" class="h-7 w-7 shrink-0 object-contain" />
          <span class="text-[15px] font-bold tracking-tight text-slate-900">MuraNight</span>
        </div>

        <button
          id="openSettingsButton"
          type="button"
          class="ui-chip inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600"
          data-i18n-title="settings_open_title"
          data-i18n-aria-label="settings_open_title"
          title="Open settings"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </header>

      <p
        id="statusMessage"
        class="ui-status hidden mb-2 rounded-xl border border-amber-200 bg-amber-50/95 px-2.5 py-2 text-[11px] font-medium text-amber-800"
        role="status"
        aria-live="polite"
      ></p>

      <div id="mainControls">
        <section class="ui-card rounded-2xl bg-white/85 p-3 shadow-[0_10px_24px_-20px_rgba(15,23,42,.45)]">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-[12px] font-bold text-slate-700" data-i18n="settings_schedule_title">Activation schedule</h3>
              <p class="mt-1 text-[11px] font-medium text-slate-500" data-i18n="settings_schedule_enabled_label">Enable schedule</p>
            </div>
            <label class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center">
              <input id="scheduleEnabledToggle" type="checkbox" class="peer sr-only" />
              <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
              <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
            </label>
          </div>
        </section>

        <section id="scheduleTimePanel" class="ui-card mt-2 hidden rounded-2xl bg-white/85 p-3 shadow-[0_10px_24px_-20px_rgba(15,23,42,.45)]">
          <div class="grid grid-cols-2 gap-2">
            <label class="grid gap-1">
              <span class="text-[11px] font-medium text-slate-500" data-i18n="settings_schedule_start_label">Start</span>
              <input
                id="scheduleStartTimeInput"
                type="time"
                step="60"
                class="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700"
              />
            </label>

            <label class="grid gap-1">
              <span class="text-[11px] font-medium text-slate-500" data-i18n="settings_schedule_end_label">End</span>
              <input
                id="scheduleEndTimeInput"
                type="time"
                step="60"
                class="w-full rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700"
              />
            </label>
          </div>
        </section>

        <section class="ui-card rounded-2xl bg-white/85 p-2.5 shadow-[0_10px_24px_-20px_rgba(15,23,42,.45)]">
          <fieldset class="grid grid-cols-2 gap-1 rounded-xl bg-slate-100/85 p-1">
            <legend class="sr-only" data-i18n="apply_mode_legend">Apply mode</legend>

            <label class="block cursor-pointer">
              <input type="radio" name="applyMode" value="per_page" checked class="peer sr-only" />
              <span
                class="ui-chip flex items-center justify-center rounded-lg border border-transparent px-2 py-2 text-[12px] font-semibold text-slate-600 transition peer-checked:border-slate-200 peer-checked:bg-white peer-checked:text-slate-900 peer-checked:shadow-sm"
                data-i18n="mode_per_page"
              >
                Per page
              </span>
            </label>

            <label class="block cursor-pointer">
              <input type="radio" name="applyMode" value="global" class="peer sr-only" />
              <span
                class="ui-chip flex items-center justify-center rounded-lg border border-transparent px-2 py-2 text-[12px] font-semibold text-slate-600 transition peer-checked:border-slate-200 peer-checked:bg-white peer-checked:text-slate-900 peer-checked:shadow-sm"
                data-i18n="mode_all_pages"
              >
                All pages
              </span>
            </label>
          </fieldset>
        </section>

        <section class="ui-card mt-2 rounded-2xl bg-white/85 p-3 shadow-[0_10px_24px_-20px_rgba(15,23,42,.45)]">
          <div id="perPageToggleRow" class="flex items-center justify-between gap-2">
            <label for="enabledToggle" class="text-[13px] font-bold text-slate-700" data-i18n="enable_this_url">Enable on this URL</label>
            <label class="relative inline-flex h-7 w-12 cursor-pointer items-center">
              <input id="enabledToggle" type="checkbox" class="peer sr-only" />
              <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
              <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
            </label>
          </div>

          <div class="mt-3">
            <div class="mb-1.5 flex items-center justify-between">
              <label for="intensityRange" class="text-[12px] font-medium text-slate-600" data-i18n="intensity_label">Intensity</label>
              <span id="intensityValue" class="text-[12px] font-semibold text-slate-700">45%</span>
            </div>
            <input
              id="intensityRange"
              type="range"
              min="0"
              max="200"
              step="1"
              value="45"
              class="range-track h-1.5 w-full cursor-pointer appearance-none rounded-full bg-slate-200"
            />
          </div>
        </section>

        <section class="ui-card mt-2 rounded-2xl bg-white/85 p-3 shadow-[0_10px_24px_-20px_rgba(15,23,42,.45)]">
          <fieldset class="grid gap-1.5">
            <legend class="mb-1 text-[12px] font-bold text-slate-600" data-i18n="color_title">Color</legend>

            <label class="block cursor-pointer">
              <input type="radio" name="colorMode" value="warm" checked class="peer sr-only" />
              <span class="ui-chip flex items-center gap-2 rounded-lg border border-transparent bg-slate-50/80 px-2.5 py-2 text-[13px] font-medium text-slate-600 transition peer-checked:border-slate-300 peer-checked:bg-white peer-checked:text-slate-900">
                <span class="h-3.5 w-3.5 rounded-full border border-amber-300 bg-[#FFCC66]"></span>
                <span data-i18n="color_warm">Warm</span>
              </span>
            </label>

            <label class="block cursor-pointer">
              <input type="radio" name="colorMode" value="blue" class="peer sr-only" />
              <span class="ui-chip flex items-center gap-2 rounded-lg border border-transparent bg-slate-50/80 px-2.5 py-2 text-[13px] font-medium text-slate-600 transition peer-checked:border-slate-300 peer-checked:bg-white peer-checked:text-slate-900">
                <span class="h-3.5 w-3.5 rounded-full border border-blue-300 bg-[#6F97FF]"></span>
                <span data-i18n="color_blue">Blue</span>
              </span>
            </label>

            <label class="block cursor-pointer">
              <input type="radio" name="colorMode" value="custom" class="peer sr-only" />
              <span class="ui-chip flex items-center gap-2 rounded-lg border border-transparent bg-slate-50/80 px-2.5 py-2 text-[13px] font-medium text-slate-600 transition peer-checked:border-slate-300 peer-checked:bg-white peer-checked:text-slate-900">
                <span class="h-3.5 w-3.5 rounded-full border border-fuchsia-300 bg-fuchsia-300"></span>
                <span data-i18n="color_custom">Custom</span>
              </span>
            </label>

            <div id="customColorPanel" class="ui-collapsible mt-1 hidden rounded-xl border border-slate-200/80 bg-slate-50/75 p-2.5">
              <div class="grid gap-1.5">
                <label for="customColorPicker" class="text-[11px] font-medium uppercase tracking-wide text-slate-500" data-i18n="picker_label">Picker</label>
                <input id="customColorPicker" type="color" value="#FFCC66" class="h-9 w-full cursor-pointer rounded-lg border border-slate-200 bg-white p-1" />
              </div>

              <div class="mt-2 grid gap-1.5">
                <label for="customColorHex" class="text-[11px] font-medium uppercase tracking-wide text-slate-500" data-i18n="hex_label">Hex</label>
                <input
                  id="customColorHex"
                  type="text"
                  value="#FFCC66"
                  maxlength="7"
                  class="rounded-lg border border-slate-300 px-2.5 py-2 text-[13px] font-medium tracking-wide text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-slate-700 focus:ring-2 focus:ring-slate-200"
                />
              </div>
            </div>
          </fieldset>
        </section>
      </div>

      <section id="settingsPanel" class="hidden absolute inset-0 z-20 bg-white/95 p-3 backdrop-blur">
        <header class="mb-2 flex items-center justify-between">
          <h2 class="text-[14px] font-bold tracking-tight text-slate-900" data-i18n="settings_title">Settings</h2>
          <button
            id="closeSettingsButton"
            type="button"
            class="ui-chip inline-flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-600"
            data-i18n-title="settings_close_title"
            data-i18n-aria-label="settings_close_title"
            title="Close settings"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </header>

        <nav role="tablist" class="ui-card grid grid-cols-4 gap-1 rounded-xl bg-slate-100/85 p-1">
          <button
            type="button"
            role="tab"
            aria-selected="true"
            data-settings-tab="general"
            class="ui-chip rounded-lg border border-slate-200 bg-white px-1.5 py-1.5 text-[11px] font-semibold text-slate-900 shadow-sm"
            data-i18n="settings_tab_general"
          >
            General
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="profiles"
            class="ui-chip rounded-lg border border-transparent px-1.5 py-1.5 text-[11px] font-semibold text-slate-600"
            data-i18n="settings_tab_profiles"
          >
            Profiles
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="data"
            class="ui-chip rounded-lg border border-transparent px-1.5 py-1.5 text-[11px] font-semibold text-slate-600"
            data-i18n="settings_tab_data"
          >
            File
          </button>
          <button
            type="button"
            role="tab"
            aria-selected="false"
            data-settings-tab="accessibility"
            class="ui-chip inline-flex items-center justify-center rounded-lg border border-transparent px-1.5 py-1.5 text-slate-600"
            data-i18n-title="settings_tab_accessibility"
            data-i18n-aria-label="settings_tab_accessibility"
            title="Accessibility"
            aria-label="Accessibility"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="4" r="1.6"></circle>
              <path d="M5 8h14"></path>
              <path d="M9 8v5l-2 7"></path>
              <path d="M15 8v5l2 7"></path>
              <path d="M9 13h6"></path>
            </svg>
          </button>
        </nav>

        <div id="settingsTabPanelsContainer" class="mt-2">
          <section data-settings-tab-panel="general" class="space-y-1.5">
            <section class="rounded-xl border border-slate-200 bg-white p-2">
              <h3 class="mb-2 text-[12px] font-bold text-slate-700" data-i18n="settings_language_title">Language</h3>
              <label class="grid gap-1">
                <span class="text-[11px] font-medium text-slate-500" data-i18n="settings_language_selector_label">Language</span>
                <select id="languageSelect" class="ui-select rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700">
                  <option value="auto">Default</option>
                  <option value="pt-BR">Português (Brasil)</option>
                  <option value="en">English</option>
                  <option value="es">Español</option>
                  <option value="fr">Français</option>
                  <option value="de">Deutsch</option>
                </select>
              </label>
            </section>

            <section class="rounded-xl border border-slate-200 bg-white p-2">
              <h3 class="mb-2 text-[12px] font-bold text-slate-700" data-i18n="settings_intensity_title">Max intensity</h3>
              <label class="grid gap-1">
                <span class="text-[11px] font-medium text-slate-500" data-i18n="settings_intensity_cap_label">Upper limit</span>
                <select id="intensityCapSelect" class="ui-select rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700">
                  <option value="200">200%</option>
                  <option value="300">300%</option>
                  <option value="400">400%</option>
                  <option value="500">500%</option>
                </select>
              </label>
            </section>

            <section class="rounded-xl border border-rose-200 bg-rose-50/70 p-2">
              <h3 class="mb-2 text-[12px] font-bold text-rose-700" data-i18n="settings_reset_title">Reset</h3>
              <button id="resetAllButton" type="button" class="ui-chip w-full rounded-lg border border-rose-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-rose-700" data-i18n="reset_button">Reset saved settings</button>
            </section>
          </section>

          <section data-settings-tab-panel="profiles" class="hidden space-y-1.5">
            <section class="rounded-xl border border-slate-200 bg-white p-2">
              <h3 class="mb-2 text-[12px] font-bold text-slate-700" data-i18n="settings_profiles_title">Local profiles</h3>
              <div class="flex gap-1.5">
                <input
                  id="profileNameInput"
                  type="text"
                  maxlength="40"
                  class="min-w-0 flex-1 rounded-lg border border-slate-300 px-2.5 py-2 text-[12px] font-medium text-slate-800 outline-none focus:border-slate-700 focus:ring-2 focus:ring-slate-200"
                  placeholder="My preset"
                  data-i18n-placeholder="profile_name_placeholder"
                />
                <button id="saveProfileButton" type="button" class="ui-chip rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-slate-700" data-i18n="profile_save_button">Save</button>
              </div>

              <label class="mt-2 grid gap-1">
                <span class="text-[11px] font-medium text-slate-500" data-i18n="profile_select_label">Saved profiles</span>
                <select id="profileSelect" class="ui-select rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-[12px] font-medium text-slate-700">
                  <option value="" data-i18n="profile_select_empty">No saved profiles</option>
                </select>
              </label>

              <div class="mt-2 grid grid-cols-2 gap-1.5">
                <button id="applySelectedProfileButton" type="button" class="ui-chip rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-slate-700" data-i18n="profile_apply_button">Apply</button>
                <button id="deleteSelectedProfileButton" type="button" class="ui-chip rounded-lg border border-rose-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-rose-700" data-i18n="profile_delete_button">Delete</button>
              </div>
            </section>
          </section>

          <section data-settings-tab-panel="data" class="hidden space-y-1.5">
            <section class="rounded-xl border border-slate-200 bg-white p-2">
              <h3 class="mb-2 text-[12px] font-bold text-slate-700" data-i18n="settings_file_title">File</h3>
              <div class="grid grid-cols-2 gap-1.5">
                <button id="exportSettingsButton" type="button" class="ui-chip rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-slate-700" data-i18n="file_export_button">Export .txt</button>
                <label for="importFileInput" class="ui-chip inline-flex cursor-pointer items-center justify-center rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-[11px] font-semibold text-slate-700" data-i18n="file_import_button">Import .txt</label>
                <input id="importFileInput" type="file" accept=".txt,.json,text/plain,application/json" class="hidden" />
              </div>
            </section>
          </section>

          <section data-settings-tab-panel="accessibility" class="hidden space-y-1.5">
            <section class="rounded-xl border border-slate-200 bg-white p-2">
              <h3 class="mb-1 text-[12px] font-bold text-slate-700" data-i18n="settings_a11y_title">Accessibility</h3>
              <p class="mb-2.5 text-[11px] font-medium text-slate-500" data-i18n="settings_a11y_desc">Always-on protections applied to every supported page.</p>

              <div class="flex items-center justify-between gap-2 py-1.5">
                <label for="a11yReduceMotionToggle" class="text-[11px] font-medium text-slate-600" data-i18n="settings_a11y_reduce_motion">Reduce motion</label>
                <label class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center">
                  <input id="a11yReduceMotionToggle" type="checkbox" class="peer sr-only" />
                  <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
                  <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
                </label>
              </div>

              <div class="flex items-center justify-between gap-2 py-1.5">
                <label for="a11ySoftenBrightnessToggle" class="text-[11px] font-medium text-slate-600" data-i18n="settings_a11y_soften_brightness">Soften brightness</label>
                <label class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center">
                  <input id="a11ySoftenBrightnessToggle" type="checkbox" class="peer sr-only" />
                  <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
                  <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
                </label>
              </div>

              <div class="flex items-center justify-between gap-2 py-1.5">
                <label for="a11yReduceSaturationToggle" class="text-[11px] font-medium text-slate-600" data-i18n="settings_a11y_reduce_saturation">Reduce strong colors</label>
                <label class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center">
                  <input id="a11yReduceSaturationToggle" type="checkbox" class="peer sr-only" />
                  <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
                  <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
                </label>
              </div>

              <div class="flex items-center justify-between gap-2 py-1.5">
                <label for="a11yFlashMitigationToggle" class="text-[11px] font-medium text-slate-600" data-i18n="settings_a11y_flash_mitigation">Flash mitigation</label>
                <label class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center">
                  <input id="a11yFlashMitigationToggle" type="checkbox" class="peer sr-only" />
                  <span class="switch-track h-7 w-12 rounded-full bg-slate-300 transition peer-checked:bg-slate-900"></span>
                  <span class="switch-knob pointer-events-none absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
                </label>
              </div>
            </section>
          </section>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
